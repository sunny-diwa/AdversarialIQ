apiVersion: apps/v1
kind: Deployment
metadata:
  name: adversarialiq-deployment
  namespace: adversarialiq
  labels:
    app: adversarialiq
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: adversarialiq
  template:
    metadata:
      labels:
        app: adversarialiq
    spec:
      containers:
        - name: adversarialiq
          image: ghcr.io/sunny-diwa/adversarialiq:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: adversarialiq-config
            - secretRef:
                name: adversarialiq-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: adversarialiq-data-pvc
